services:
  tor:
    image: dperson/torproxy:latest
    restart: unless-stopped
  php2shell:
    build: .
    depends_on: [tor]
    environment:
      - ALL_PROXY=socks5://tor:9050
    volumes:
      - ./targets.txt:/work/targets.txt:ro
      - ./out:/work/out
    command: ["scan", "/work/targets.txt", "--tor", "--out", "/work/out"]